# systemd drop-in for the existing API unit (operator applies it; the deploy tool does not):
#   sudo install -D -m 0644 ops/kirothon-api-team-env.conf /etc/systemd/system/kirothon-api.service.d/team-env.conf
#   sudo systemctl daemon-reload && sudo systemctl restart kirothon-api.service
# It only adds the team keys and the shared DB path. The '-' prefix keeps the API starting if the file is absent.
[Service]
EnvironmentFile=-/home/ubuntu/kirothon-config/team.env
Environment=KIROTHON_DB_PATH=/home/ubuntu/kirothon-data/records.sqlite3
